<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Complete Course — Modern Edition</title>
    <script>
        (function () {
            try {
                var th = localStorage.getItem('js-theme');
                if (th) document.documentElement.setAttribute('data-theme', th);
                if (localStorage.getItem('pj-lang') === 'mm' || localStorage.getItem('buddyEduLang') === 'my') document.documentElement.setAttribute('lang', 'my');
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e4e9f2;
            --primary: #6366f1;
            --primary-2: #8b5cf6;
            --primary-soft: rgba(99, 102, 241, .12);
            --code-bg: #0f172a;
            --code-head: rgba(148, 163, 184, .08);
            --shadow: 0 18px 40px -22px rgba(15, 23, 42, .35);
            --sidebar: #0f172a;
            --sidebar-2: #1e293b;
            --sidebar-text: #cbd5e1;
            --ok: #10b981;
        }

        html[data-theme="dark"] {
            --bg: #0b1120;
            --surface: #0f172a;
            --surface-2: #131c30;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: #1e293b;
            --primary: #818cf8;
            --primary-2: #a78bfa;
            --primary-soft: rgba(129, 140, 248, .16);
            --code-bg: #020617;
            --sidebar: #0b1120;
            --sidebar-2: #111c33;
            --shadow: 0 18px 40px -22px rgba(0, 0, 0, .8);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--primary); }

        /* ---------- Sidebar ---------- */
        .sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 320px;
            background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            z-index: 60;
            transition: transform .32s cubic-bezier(.4, 0, .2, 1);
        }

        .brand {
            padding: 20px 22px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, .15);
        }

        .brand-logo {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: grid; place-items: center;
            font-weight: 800; font-size: 18px; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 8px 18px -6px rgba(99, 102, 241, .8);
        }

        .brand h1 { font-size: 15px; margin: 0; color: #fff; letter-spacing: .2px; }
        .brand span { font-size: 12px; color: #94a3b8; }

        .search {
            padding: 14px 16px 6px;
            position: relative;
        }

        .search input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, .22);
            background: rgba(2, 6, 23, .45);
            color: #e2e8f0;
            font-size: 13.5px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .25);
        }

        .search svg {
            position: absolute;
            left: 28px; top: 50%;
            transform: translateY(-38%);
            width: 15px; height: 15px;
            color: #64748b;
        }

        .nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 20px;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }

        .nav::-webkit-scrollbar { width: 8px; }
        .nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }

        .part-head {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding: 11px 12px;
            border: 0;
            border-radius: 10px;
            background: rgba(148, 163, 184, .08);
            color: #e2e8f0;
            font: inherit;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .06em;
            text-align: left;
            cursor: pointer;
            transition: background .18s;
        }

        .part-head:hover { background: rgba(148, 163, 184, .16); }
        .part-head .arrow { margin-left: auto; width: 14px; height: 14px; color: #94a3b8; transition: transform .2s; }
        .part-head.open .arrow { transform: rotate(90deg); }

        .nav-group {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: #7c8aa3;
            font-weight: 700;
            padding: 13px 12px 4px;
            line-height: 1.4;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 16px;
            border: 0;
            background: transparent;
            color: var(--sidebar-text);
            font: inherit;
            font-size: 13.5px;
            text-align: left;
            border-radius: 9px;
            cursor: pointer;
            transition: background .18s, color .18s;
        }

        .nav-item:hover { background: rgba(148, 163, 184, .12); color: #fff; }
        .nav-item .nav-num {
            width: 26px; height: 22px; flex: none;
            display: grid; place-items: center;
            font-size: 10.5px; font-weight: 700;
            border-radius: 6px;
            background: rgba(148, 163, 184, .15);
            color: #cbd5e1;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, .9), rgba(139, 92, 246, .85));
            color: #fff;
            box-shadow: 0 10px 20px -12px rgba(99, 102, 241, .9);
        }

        .nav-item.active .nav-num { background: rgba(255, 255, 255, .22); color: #fff; }
        .nav-item.done .nav-num { background: rgba(16, 185, 129, .2); color: #34d399; }
        .nav-item.done.active .nav-num { background: rgba(255, 255, 255, .22); color: #fff; }

        .sidebar-foot {
            padding: 14px 18px 20px;
            border-top: 1px solid rgba(148, 163, 184, .15);
            font-size: 12px;
            color: #94a3b8;
        }

        .track {
            height: 7px;
            border-radius: 99px;
            background: rgba(148, 163, 184, .2);
            overflow: hidden;
            margin-top: 8px;
        }

        .track > i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            transition: width .4s ease;
        }

        /* ---------- Main ---------- */
        .main {
            margin-left: 320px;
            min-height: 100vh;
            padding: 26px 44px 90px;
        }

        .inner { max-width: 980px; margin: 0 auto; }

        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .crumb { font-size: 13px; color: var(--muted); flex: 1; }
        .crumb b { color: var(--text); font-weight: 600; }

        .icon-btn {
            margin-left: auto;
            width: 42px; height: 42px;
            display: grid; place-items: center;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: transform .18s, box-shadow .18s, border-color .18s;
        }

        .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--primary); }
        .icon-btn svg { width: 19px; height: 19px; }

        .menu-btn {
            display: none;
            width: 42px; height: 42px;
            place-items: center;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .doc {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 44px 46px 48px;
            box-shadow: var(--shadow);
            animation: rise .42s cubic-bezier(.2, .7, .2, 1);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--primary);
            background: var(--primary-soft);
            padding: 5px 11px;
            border-radius: 99px;
            margin-bottom: 12px;
        }

        .doc h2 {
            font-size: 1.9rem;
            line-height: 1.2;
            margin: 0 0 18px;
            letter-spacing: -.02em;
        }

        .doc h3 {
            font-size: 1.15rem;
            margin: 28px 0 10px;
            letter-spacing: -.01em;
        }

        .doc p { margin: 0 0 14px; color: var(--text); }

        .doc ul { margin: 0 0 16px; padding-left: 22px; }
        .doc li { margin: 6px 0; }

        .doc p code, .doc li code, .doc td code {
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: .86em;
            background: var(--primary-soft);
            color: var(--primary);
            padding: .12em .42em;
            border-radius: 6px;
        }

        /* ---------- Code blocks ---------- */
        .code {
            margin: 18px 0;
            border-radius: 14px;
            overflow: hidden;
            background: var(--code-bg);
            border: 1px solid rgba(148, 163, 184, .16);
            box-shadow: var(--shadow);
        }

        .code-head {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 14px;
            background: var(--code-head);
            border-bottom: 1px solid rgba(148, 163, 184, .12);
        }

        .dots { display: flex; gap: 6px; }
        .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
        .dots i:nth-child(1) { background: #ff5f57; }
        .dots i:nth-child(2) { background: #febc2e; }
        .dots i:nth-child(3) { background: #28c840; }

        .code-label {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 8px;
            letter-spacing: .03em;
        }

        .copy {
            margin-left: auto;
            border: 1px solid rgba(148, 163, 184, .28);
            background: transparent;
            color: #cbd5e1;
            font: inherit;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
        }

        .copy:hover { background: rgba(148, 163, 184, .16); }
        .copy.ok { color: #34d399; border-color: #34d399; }

        .code pre {
            margin: 0;
            padding: 18px 20px;
            overflow: auto;
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 13.5px;
            line-height: 1.75;
            color: #e2e8f0;
            tab-size: 4;
        }

        .code pre code { background: none; color: inherit; padding: 0; }

        .t-kw { color: #c792ea; }
        .t-str { color: #c3e88d; }
        .t-num { color: #f78c6c; }
        .t-com { color: #5c6b8a; font-style: italic; }

        /* ---------- Pager ---------- */
        .pager {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 34px;
            padding-top: 26px;
            border-top: 1px solid var(--border);
        }

        .pager button {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 190px;
            padding: 13px 18px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            text-align: left;
            transition: transform .18s, border-color .18s, box-shadow .18s;
        }

        .pager button.next { text-align: right; margin-left: auto; }
        .pager button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow); }
        .pager button:disabled { opacity: .4; cursor: not-allowed; }
        .pager small { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; }
        .pager b { font-weight: 600; font-size: 14.5px; }

        .backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, .55);
            backdrop-filter: blur(2px);
            z-index: 55;
        }

        .lang-btn { width: auto; min-width: 42px; padding: 0 12px; font-weight: 800; font-size: 13px; }
        .plan-btn { text-decoration: none; }
        .lang-note { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; }

        /* ---------- Responsive ---------- */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); box-shadow: 0 0 60px rgba(0, 0, 0, .5); }
            body.nav-open .sidebar { transform: none; }
            body.nav-open .backdrop { display: block; }
            .main { margin-left: 0; padding: 18px 18px 70px; }
            .menu-btn { display: grid; }
            .plan-btn { display: none; }
            .doc { padding: 28px 22px 32px; border-radius: 18px; }
            .doc h2 { font-size: 1.55rem; }
            .pager button { min-width: 0; flex: 1; }
        }
    </style>
    <script src="../../assets/js/transitions.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">JS</div>
            <div>
                <h1>JavaScript Complete Course</h1>
                <span id="brand-sub">100 lessons · 16 modules</span>
            </div>
        </div>
        <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input id="search" type="search" placeholder="Search 100 topics…" autocomplete="off">
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot">
            <div><strong id="progress-text">0 / 0</strong> <span id="progress-label">topics explored</span></div>
            <div class="track"><i id="progress-bar"></i></div>
        </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
        <div class="inner">
            <div class="topbar">
                <button class="menu-btn icon-btn" id="menu-btn" aria-label="Menu" style="margin-left:0">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="crumb">Course &nbsp;/&nbsp; <b id="crumb">Loading…</b></div>
                <a class="icon-btn plan-btn" href="../../CoursePlan/JavaScript/index.html" id="plan-link" aria-label="Study plan" title="Study plan" style="text-decoration:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><path d="M8 3v3M16 3v3M3 9.5h18M8 14h3"></path>
                    </svg>
                </a>
                <a class="icon-btn" href="../index.html" id="home-link" aria-label="Back to home" title="Back to home" style="text-decoration:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9.5 21v-6h5v6"></path>
                    </svg>
                </a>
                <button class="icon-btn lang-btn" id="lang-btn" type="button" title="Switch language"><span id="lang-label">EN</span></button>
                <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme"></button>
            </div>

            <article class="doc" id="doc"></article>
        </div>
    </main>

    <script>
        /* ---------------- Language (English / Myanmar) ---------------- */
        var LANG = 'en';
        try { if (localStorage.getItem('pj-lang') === 'mm' || localStorage.getItem('buddyEduLang') === 'my') LANG = 'mm'; } catch (e) {}
        var STR = {
            en: { copy: 'Copy', copied: 'Copied!', prev: 'Previous', next: 'Next', start: 'Start', end: 'End', noTopics: 'No topics found', home: 'Back to home', plan: 'Study plan', theme: 'Toggle dark mode', menu: 'Open menu', langAria: 'Switch language', topics: 'topics explored' },
            mm: { copy: 'ကူးယူရန်', copied: 'ကူးယူပြီးပါပြီ!', prev: 'ယခင်', next: 'နောက်', start: 'အစ', end: 'အဆုံး', noTopics: 'ခေါင်းစဉ် ရှာမတွေ့ပါ', home: 'ပင်မစာမျက်နှာ', plan: 'လေ့လာရေးအစီအစဉ်', theme: 'အမှောင်/အလင်း ပြောင်းရန်', menu: 'မီနူး ဖွင့်ရန်', langAria: 'ဘာသာစကား ပြောင်းရန်', topics: 'ခေါင်းစဉ် လေ့လာပြီး' }
        };
        function tr(k) { return (STR[LANG] && STR[LANG][k]) || STR.en[k] || k; }
        function setLang(l) { try { localStorage.setItem('pj-lang', l); localStorage.setItem('buddyEduLang', l === 'mm' ? 'my' : 'en'); } catch (e) {} location.reload(); }

        /* ---------------- Syntax highlighting ---------------- */
        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        var TOK = {
            re: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`[^`]*`|'[^']*'|"[^"]*")|\b(const|let|var|function|return|if|else|for|while|do|of|in|new|class|constructor|this|typeof|instanceof|null|undefined|true|false|async|await|try|catch|finally|throw|switch|case|break|continue|default|extends|super|static|get|set|export|import|from|yield)\b|\b(\d+(?:\.\d+)?)\b/g
        };

        function highlight(src) {
            return esc(src).replace(TOK.re, function (m, com, str, kw, num) {
                if (com) return '<span class="t-com">' + com + '</span>';
                if (str) return '<span class="t-str">' + str + '</span>';
                if (kw) return '<span class="t-kw">' + kw + '</span>';
                if (num) return '<span class="t-num">' + num + '</span>';
                return m;
            });
        }

        function codeBlock(src, label) {
            var clean = src.replace(/^\n/, '').replace(/\n[ \t]*$/, '').replace(/\t/g, '    ');
            return '<div class="code">' +
                '<div class="code-head"><span class="dots"><i></i><i></i><i></i></span>' +
                '<span class="code-label">' + (label || 'JavaScript') + '</span>' +
                '<button class="copy" onclick="copyCode(this)">' + tr('copy') + '</button></div>' +
                '<pre><code>' + highlight(clean) + '</code></pre></div>';
        }

        function t(title, blocks, mmTitle, mmBlocks) {
            var mmBody = null;
            if (mmTitle && mmBlocks) {
                mmBody = mmBlocks.map(function (b) {
                    return (typeof b === 'string' && /^@\d+$/.test(b)) ? blocks[+b.slice(1)] : b;
                }).join('');
            }
            return {
                title: (LANG === 'mm' && mmTitle) ? mmTitle : title,
                body: (LANG === 'mm' && mmBody) ? mmBody : blocks.join(''),
                titleEn: title,
                titleMm: mmTitle || title
            };
        }

        function copyCode(btn) {
            var code = btn.closest('.code').querySelector('pre code');
            var text = code.innerText;
            var fallback = function () {
                try {
                    var r = document.createRange(); r.selectNode(code);
                    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
                    document.execCommand('copy'); sel.removeAllRanges();
                } catch (e) {}
            };
            var done = function () {
                btn.textContent = tr('copied');
                btn.classList.add('ok');
                setTimeout(function () { btn.textContent = tr('copy'); btn.classList.remove('ok'); }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); done(); });
            } else { fallback(); done(); }
        }

        /* ---------------- Course content ---------------- */
        var COURSE = [
            { short: 'Part 1', name: 'Core JavaScript Language', mmName: 'JavaScript အခြေခံဘာသာစကား', modules: [
                { name: 'Module 1 · Getting Started', mmName: 'မော်ဂျူး ၁ · စတင်လေ့လာခြင်း', items: [
                    t('What is JavaScript? History and Engine Basics', [
                        "<p>JavaScript (JS) is a lightweight, interpreted (JIT-compiled) programming language that adds interactivity to web pages. It was created by Brendan Eich at Netscape in 1995 and standardized as <b>ECMAScript</b> in 1997.</p>",
                        "<p>A <b>JavaScript engine</b> parses your code, compiles it to bytecode/machine code, and runs it. Examples: <code>V8</code> (Chrome, Node.js), <code>SpiderMonkey</code> (Firefox), <code>JavaScriptCore</code> (Safari).</p>",
                        codeBlock('// Your first JavaScript program\nconsole.log("Hello, world!");\n\n// The engine reads, compiles and runs this line')
                    ],
                    'JavaScript ဆိုတာ ဘာလဲ? သမိုင်းနှင့် Engine အခြေခံများ', [

        /* ---------------- Flatten the course ---------------- */
        var MODULES = 0;
        COURSE.forEach(function (p) { MODULES += p.modules.length; });
        var SECTIONS = [];
        var TREE = COURSE.map(function (part, pi) {
            var partName = (LANG === 'mm' && part.mmName) ? part.mmName : part.name;
            return {
                short: part.short,
                name: partName,
                nameEn: part.name,
                nameMm: part.mmName || part.name,
                pi: pi,
                modules: part.modules.map(function (mod) {
                    var modName = (LANG === 'mm' && mod.mmName) ? mod.mmName : mod.name;
                    return {
                        name: modName,
                        nameEn: mod.name,
                        nameMm: mod.mmName || mod.name,
                        items: mod.items.map(function (item) {
                            var rec = {
                                n: SECTIONS.length + 1,
                                id: 't' + (SECTIONS.length + 1),
                                title: item.title,
                                body: item.body,
                                titleEn: item.titleEn,
                                titleMm: item.titleMm,
                                pi: pi,
                                part: part.short,
                                module: modName
                            };
                            SECTIONS.push(rec);
                            return rec;
                        })
                    };
                })
            };
        });

        /* ---------------- State ---------------- */
        function loadArr(key) {
            try { var v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
        }
        function loadStr(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

        var state = {
            index: 0,
            theme: loadStr('js-theme') || 'light',
            visited: new Set(loadArr('js-visited')),
            openParts: new Set()
        };

        state.visited = new Set(Array.from(state.visited).filter(function (id) {
            return SECTIONS.some(function (s) { return s.id === id; });
        }));

        var saved = loadStr('js-active');
        if (saved) {
            var found = SECTIONS.findIndex(function (s) { return s.id === saved; });
            if (found >= 0) state.index = found;
        }
        state.openParts.add(SECTIONS[state.index].pi);

        /* ---------------- Elements ---------------- */
        var navEl = document.getElementById('nav');
        var docEl = document.getElementById('doc');
        var crumbEl = document.getElementById('crumb');
        var searchEl = document.getElementById('search');
        var themeBtn = document.getElementById('theme-btn');

        var ICONS = {
            sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
            moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>',
            arrow: '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>'
        };

        /* ---------------- Navigation tree ---------------- */
        function matchTitle(it, filter) {
            if (!filter) return true;
            return (it.titleEn || it.title).toLowerCase().indexOf(filter) > -1 ||
                (it.titleMm || '').toLowerCase().indexOf(filter) > -1;
        }
        function matchName(en, mm, filter) {
            if (!filter) return false;
            return en.toLowerCase().indexOf(filter) > -1 || mm.toLowerCase().indexOf(filter) > -1;
        }

        function renderNav(filter) {
            filter = (filter || '').toLowerCase();
            var html = '';

            TREE.forEach(function (part) {
                var partHit = false;
                if (filter) {
                    partHit = matchName(part.nameEn, part.nameMm, filter) ||
                        part.short.toLowerCase().indexOf(filter) > -1;
                    var any = partHit || part.modules.some(function (mod) {
                        return mod.items.some(function (it) {
                            return matchTitle(it, filter) ||
                                matchName(mod.nameEn, mod.nameMm, filter);
                        });
                    });
                    if (!any) return;
                }

                var open = filter ? true : state.openParts.has(part.pi);
                html += '<button class="part-head ' + (open ? 'open' : '') + '" onclick="togglePart(' + part.pi + ')">' +
                    part.short + ' · ' + part.name + ICONS.arrow + '</button>';

                if (!open) return;

                part.modules.forEach(function (mod) {
                    var items = mod.items.filter(function (it) {
                        if (!filter) return true;
                        return partHit || matchTitle(it, filter) ||
                            matchName(mod.nameEn, mod.nameMm, filter);
                    });
                    if (!items.length) return;

                    html += '<div class="nav-group">' + mod.name + '</div>';
                    items.forEach(function (it) {
                        var cls = 'nav-item';
                        if (it.n - 1 === state.index) cls += ' active';
                        if (state.visited.has(it.id)) cls += ' done';
                        html += '<button class="' + cls + '" onclick="go(' + (it.n - 1) + ')">' +
                            '<span class="nav-num">' + it.n + '</span>' +
                            '<span>' + it.title + '</span></button>';
                    });
                });
            });

            if (!html) html = '<div class="nav-group">' + tr('noTopics') + '</div>';
            navEl.innerHTML = html;
        }

        function togglePart(pi) {
            if (state.openParts.has(pi)) state.openParts.delete(pi);
            else state.openParts.add(pi);
            renderNav(searchEl.value);
        }

        function renderProgress() {
            document.getElementById('progress-text').textContent = state.visited.size + ' / ' + SECTIONS.length;
            document.getElementById('progress-bar').style.width = (state.visited.size / SECTIONS.length * 100) + '%';
        }

        function go(i) {
            if (i < 0 || i >= SECTIONS.length) return;
            state.index = i;
            var s = SECTIONS[i];
            state.visited.add(s.id);
            state.openParts.add(s.pi);
            store('js-active', s.id);
            store('js-visited', JSON.stringify(Array.from(state.visited)));

            crumbEl.textContent = s.part + ' · ' + s.title;
            docEl.innerHTML = '<span class="tag">' + s.part + ' — ' + s.module + '</span>' + s.body +
                '<div class="pager">' +
                '<button ' + (i === 0 ? 'disabled' : '') + ' onclick="go(' + (i - 1) + ')">' +
                '<small>' + tr('prev') + '</small><b>' + (i > 0 ? SECTIONS[i - 1].title : tr('start')) + '</b></button>' +
                '<button class="next" ' + (i === SECTIONS.length - 1 ? 'disabled' : '') + ' onclick="go(' + (i + 1) + ')">' +
                '<small>' + tr('next') + '</small><b>' + (i < SECTIONS.length - 1 ? SECTIONS[i + 1].title : tr('end')) + '</b></button>' +
                '</div>';

            renderNav(searchEl.value);
            renderProgress();
            window.scrollTo(0, 0);
            closeNav();
        }

        /* ---------------- Theme ---------------- */
        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            themeBtn.innerHTML = state.theme === 'dark' ? ICONS.sun : ICONS.moon;
            store('js-theme', state.theme);
        }

        themeBtn.addEventListener('click', function () {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
        });

        /* ---------------- Mobile nav ---------------- */
        var menuBtn = document.getElementById('menu-btn');
        var backdrop = document.getElementById('backdrop');
        function closeNav() { document.body.classList.remove('nav-open'); }
        menuBtn.addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
        backdrop.addEventListener('click', closeNav);

        /* ---------------- Search & keyboard ---------------- */
        searchEl.addEventListener('input', function () { renderNav(this.value); });

        document.addEventListener('keydown', function (e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            var tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea') return;
            if (e.key === 'ArrowRight') go(state.index + 1);
            if (e.key === 'ArrowLeft') go(state.index - 1);
        });

        /* ---------------- Init ---------------- */
        var langBtn = document.getElementById('lang-btn');
        var langLabelEl = document.getElementById('lang-label');
        var homeLink = document.getElementById('home-link');
        langLabelEl.textContent = LANG === 'mm' ? 'မြန်မာ' : 'EN';
        langBtn.title = tr('langAria');
        langBtn.setAttribute('aria-label', tr('langAria'));
        homeLink.title = tr('home');
        homeLink.setAttribute('aria-label', tr('home'));
        var planLink = document.getElementById('plan-link');
        planLink.title = tr('plan');
        planLink.setAttribute('aria-label', tr('plan'));
        themeBtn.title = tr('theme');
        themeBtn.setAttribute('aria-label', tr('theme'));
        menuBtn.title = tr('menu');
        menuBtn.setAttribute('aria-label', tr('menu'));
        langBtn.addEventListener('click', function () { setLang(LANG === 'mm' ? 'en' : 'mm'); });
        document.getElementById('brand-sub').textContent = LANG === 'mm'
            ? ('သင်ခန်းစာ ' + SECTIONS.length + ' ခု · မော်ဂျူး ' + MODULES + ' ခု')
            : (SECTIONS.length + ' lessons · ' + MODULES + ' modules');
        searchEl.placeholder = LANG === 'mm'
            ? ('ခေါင်းစဉ် ' + SECTIONS.length + ' ခု ရှာရန်…')
            : ('Search ' + SECTIONS.length + ' topics…');
        document.getElementById('progress-label').textContent = tr('topics');
        applyTheme();
        go(state.index);
    </script>
</body>
</html>
