<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04. Products REST API — Buddy Demo</title>
<style>
:root{--accent:#16a34a;--dark:#15803d;--soft:#f0fdf4;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--border:#e4e9f2;--card:#fff}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 5%;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.demo-bar .back{font-weight:700;font-size:14px;color:#fff;text-decoration:none;padding:8px 15px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--dark))}
.demo-bar .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.demo{width:min(920px,92%);margin:34px auto 64px;flex:1}
.demo h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.demo .lead{color:var(--muted);margin:8px 0 26px;max-width:640px}
.demo-foot{border-top:1px solid var(--border);padding:18px 5%;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 28px -22px rgba(15,23,42,.45);margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:10px;letter-spacing:-.01em}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--soft)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
pre,.terminal{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13.5px;line-height:1.7}
.grid{display:grid;gap:16px}
code{font-family:Consolas,monospace;background:var(--soft);color:var(--dark);padding:2px 6px;border-radius:6px;font-size:.92em}
.code-block{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;margin:14px 0;white-space:pre}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


</style>
    <script src="../../../assets/js/transitions.js"></script>
</head>
<body>
<header class="demo-bar">
    <a class="back" href="../../Node/index.html">← Back to Node.js Course</a>
    <span class="tag">Node.js · Project 04</span>
</header>
<main class="demo">
    <h1>04. Products REST API</h1>
    <p class="lead">Build an Express API with full CRUD endpoints for a product list.</p>
    
<section class="panel">
    <div class="row" style="margin-bottom:12px">
        <select id="mSel">
            <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
        </select>
        <input id="mPath" value="/api/products" style="flex:1;font-family:Consolas,monospace">
        <button class="btn" id="mSend">Send</button>
    </div>
    <label for="mBody">Request body (JSON, for POST/PUT)</label>
    <textarea id="mBody" rows="3" style="font-family:Consolas,monospace">{ "name": "Keyboard", "price": 89 }</textarea>
    <pre id="mOut" style="margin-top:12px">// Response appears here</pre>
</section>
<script>
(function () {
    var products = [
        { id: 1, name: 'Headphones', price: 149 },
        { id: 2, name: 'Keyboard', price: 89 }
    ];
    var nextId = 3;
    document.getElementById('mSend').addEventListener('click', function () {
        var method = document.getElementById('mSel').value;
        var path = document.getElementById('mPath').value.trim();
        var out = document.getElementById('mOut');
        var body = null;
        if (method === 'POST' || method === 'PUT') {
            try { body = JSON.parse(document.getElementById('mBody').value); }
            catch (e) { out.textContent = '400 Bad Request\n{ "error": "Invalid JSON" }'; return; }
        }
        var res, status;
        var m = path.match(/^\/api\/products\/?$/), one = path.match(/^\/api\/products\/(\d+)$/);
        if (m) {
            if (method === 'GET') { status = 200; res = products; }
            else if (method === 'POST') {
                var p = { id: nextId++, name: body.name || 'Untitled', price: Number(body.price) || 0 };
                products.push(p); status = 201; res = p;
            } else { status = 405; res = { error: method + ' not allowed on /api/products' }; }
        } else if (one) {
            var idx = products.findIndex(function (x) { return x.id === +one[1]; });
            if (idx === -1) { status = 404; res = { error: 'Product not found' }; }
            else if (method === 'GET') { status = 200; res = products[idx]; }
            else if (method === 'PUT') {
                products[idx] = { id: +one[1], name: body.name || products[idx].name, price: Number(body.price) || products[idx].price };
                status = 200; res = products[idx];
            } else { status = 200; res = products.splice(idx, 1)[0]; }
        } else { status = 404; res = { error: 'Route not found' }; }
        out.textContent = method + ' ' + path + ' → ' + status + '\n\n' + JSON.stringify(res, null, 2);
    });
})();
</script>
</main>
<footer class="demo-foot">Buddy Edu · Practical Work demo — Node.js Project 04</footer>
</body>
</html>
