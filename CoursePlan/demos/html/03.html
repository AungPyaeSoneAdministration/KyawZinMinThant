<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03. Registration Form — Buddy Demo</title>
<style>
:root{--accent:#ea580c;--dark:#c2410c;--soft:#fff7ed;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--border:#e4e9f2;--card:#fff}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 5%;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.demo-bar .back{font-weight:700;font-size:14px;color:#fff;text-decoration:none;padding:8px 15px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--dark))}
.demo-bar .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.demo{width:min(920px,92%);margin:34px auto 64px;flex:1}
.demo h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.demo .lead{color:var(--muted);margin:8px 0 26px;max-width:640px}
.demo-foot{border-top:1px solid var(--border);padding:18px 5%;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 28px -22px rgba(15,23,42,.45);margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:10px;letter-spacing:-.01em}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--soft)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
pre,.terminal{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13.5px;line-height:1.7}
.grid{display:grid;gap:16px}
code{font-family:Consolas,monospace;background:var(--soft);color:var(--dark);padding:2px 6px;border-radius:6px;font-size:.92em}
.code-block{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;margin:14px 0;white-space:pre}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


</style>
</head>
<body>
<header class="demo-bar">
    <a class="back" href="../../HTML/index.html">← Back to HTML Course</a>
    <span class="tag">HTML · Project 03</span>
</header>
<main class="demo">
    <h1>03. Registration Form</h1>
    <p class="lead">Build a form with name, email, password, and other fields.</p>
    
<section class="panel" style="max-width:520px">
    <h2>Student Registration</h2>
    <form id="regForm" novalidate>
        <label for="f-name">Full name</label>
        <input id="f-name" name="name" required placeholder="e.g. Aye Mya">
        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" required placeholder="you@example.com">
        <label for="f-pass">Password</label>
        <input id="f-pass" name="password" type="password" required minlength="6" placeholder="At least 6 characters">
        <label for="f-city">City</label>
        <select id="f-city" name="city">
            <option>Yangon</option><option>Mandalay</option><option>Naypyidaw</option><option>Other</option>
        </select>
        <label style="display:flex;gap:8px;align-items:center;font-weight:600;margin-top:14px">
            <input type="checkbox" style="width:auto" required> I accept the terms
        </label>
        <div class="row" style="margin-top:16px">
            <button class="btn" type="submit">Register</button>
            <button class="btn ghost" type="reset">Reset</button>
        </div>
        <p id="msg" role="status" style="margin-top:12px;font-weight:700"></p>
    </form>
</section>
<script>
document.getElementById('regForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('msg');
    if (!this.checkValidity()) {
        msg.textContent = 'Please fill in every required field correctly.';
        msg.style.color = '#dc2626';
        this.reportValidity();
        return;
    }
    msg.textContent = 'Registered! Welcome, ' + this.name.value + '.';
    msg.style.color = 'var(--dark)';
});
</script>
</main>
<footer class="demo-foot">Buddy Edu · Practical Work demo — HTML Project 03</footer>
</body>
</html>
