<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04. To-Do List — Buddy Demo</title>
<style>
:root{--accent:#2563eb;--dark:#1d4ed8;--soft:#eff6ff;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--border:#e4e9f2;--card:#fff}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 5%;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.demo-bar .back{font-weight:700;font-size:14px;color:#fff;text-decoration:none;padding:8px 15px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--dark))}
.demo-bar .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.demo{width:min(920px,92%);margin:34px auto 64px;flex:1}
.demo h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.demo .lead{color:var(--muted);margin:8px 0 26px;max-width:640px}
.demo-foot{border-top:1px solid var(--border);padding:18px 5%;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 28px -22px rgba(15,23,42,.45);margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:10px;letter-spacing:-.01em}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--soft)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
pre,.terminal{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13.5px;line-height:1.7}
.grid{display:grid;gap:16px}
code{font-family:Consolas,monospace;background:var(--soft);color:var(--dark);padding:2px 6px;border-radius:6px;font-size:.92em}
.code-block{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;margin:14px 0;white-space:pre}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


</style>
</head>
<body>
<header class="demo-bar">
    <a class="back" href="../../JavaScript/index.html">← Back to JavaScript Course</a>
    <span class="tag">JavaScript · Project 04</span>
</header>
<main class="demo">
    <h1>04. To-Do List</h1>
    <p class="lead">Add, complete, and delete tasks with saved progress.</p>
    
<section class="panel" style="max-width:520px">
    <form id="todoForm" class="row">
        <input id="todoInput" placeholder="What needs doing?" style="flex:1" autocomplete="off">
        <button class="btn" type="submit">Add</button>
    </form>
    <div class="row" style="margin-top:12px">
        <button class="btn ghost f-btn" data-f="all">All</button>
        <button class="btn ghost f-btn" data-f="active">Active</button>
        <button class="btn ghost f-btn" data-f="done">Done</button>
        <span class="muted" style="margin-left:auto" id="todoStat"></span>
    </div>
    <ul id="todoList" class="todo-list"></ul>
</section>
<script>
(function () {
    var KEY = 'buddy-demo-todos';
    var todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
    var filter = 'all';
    var list = document.getElementById('todoList');
    var stat = document.getElementById('todoStat');
    function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} }
    function render() {
        var shown = todos.filter(function (t) {
            return filter === 'all' || (filter === 'done' ? t.done : !t.done);
        });
        list.innerHTML = shown.map(function (t) {
            var idx = todos.indexOf(t);
            return '<li' + (t.done ? ' class="done"' : '') + '>' +
                '<input type="checkbox" data-toggle="' + idx + '"' + (t.done ? ' checked' : '') + ' style="width:auto">' +
                '<span>' + t.text + '</span>' +
                '<button class="btn ghost" data-del="' + idx + '" style="padding:3px 10px;font-size:12px;margin-left:auto">✕</button></li>';
        }).join('') || '<li class="muted">Nothing here.</li>';
        var left = todos.filter(function (t) { return !t.done; }).length;
        stat.textContent = left + ' active · ' + todos.length + ' total';
    }
    document.getElementById('todoForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var input = document.getElementById('todoInput');
        var text = input.value.trim();
        if (!text) return;
        todos.push({ text: text, done: false });
        input.value = ''; save(); render();
    });
    list.addEventListener('change', function (e) {
        var i = e.target.getAttribute && e.target.getAttribute('data-toggle');
        if (i === null || i === undefined) return;
        todos[+i].done = e.target.checked; save(); render();
    });
    list.addEventListener('click', function (e) {
        var i = e.target.getAttribute && e.target.getAttribute('data-del');
        if (i === null || i === undefined) return;
        todos.splice(+i, 1); save(); render();
    });
    document.querySelectorAll('.f-btn').forEach(function (b) {
        b.addEventListener('click', function () { filter = b.getAttribute('data-f'); render(); });
    });
    render();
})();
</script>
<style>
.todo-list{list-style:none;margin-top:12px}
.todo-list li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fff}
.todo-list li.done span{text-decoration:line-through;color:var(--muted)}
</style>
</main>
<footer class="demo-foot">Buddy Edu · Practical Work demo — JavaScript Project 04</footer>
</body>
</html>
