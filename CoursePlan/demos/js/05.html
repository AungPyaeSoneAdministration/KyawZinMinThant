<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05. Quiz Application — Buddy Demo</title>
<style>
:root{--accent:#2563eb;--dark:#1d4ed8;--soft:#eff6ff;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--border:#e4e9f2;--card:#fff}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 5%;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.demo-bar .back{font-weight:700;font-size:14px;color:#fff;text-decoration:none;padding:8px 15px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--dark))}
.demo-bar .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.demo{width:min(920px,92%);margin:34px auto 64px;flex:1}
.demo h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.demo .lead{color:var(--muted);margin:8px 0 26px;max-width:640px}
.demo-foot{border-top:1px solid var(--border);padding:18px 5%;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 28px -22px rgba(15,23,42,.45);margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:10px;letter-spacing:-.01em}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--soft)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
pre,.terminal{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13.5px;line-height:1.7}
.grid{display:grid;gap:16px}
code{font-family:Consolas,monospace;background:var(--soft);color:var(--dark);padding:2px 6px;border-radius:6px;font-size:.92em}
.code-block{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;margin:14px 0;white-space:pre}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


</style>
</head>
<body>
<header class="demo-bar">
    <a class="back" href="../../JavaScript/index.html">← Back to JavaScript Course</a>
    <span class="tag">JavaScript · Project 05</span>
</header>
<main class="demo">
    <h1>05. Quiz Application</h1>
    <p class="lead">Build questions, answer selection, and score tracking.</p>
    
<section class="panel" style="max-width:560px">
    <div id="quizBox">
        <p class="muted" id="quizProg"></p>
        <h2 id="quizQ"></h2>
        <div id="quizOpts" class="quiz-opts"></div>
    </div>
    <div id="quizDone" hidden>
        <h2>Quiz complete!</h2>
        <p class="quiz-score">Score: <b id="quizScore"></b></p>
        <button class="btn" id="quizRetry">Try again</button>
    </div>
</section>
<script>
(function () {
    var QUESTIONS = [
        { q: 'Which keyword declares a block-scoped variable?', a: ['var', 'let', 'static', 'def'], c: 1 },
        { q: 'What does DOM stand for?', a: ['Data Object Model', 'Document Object Model', 'Document Order Map', 'Dynamic Output Mode'], c: 1 },
        { q: 'Which method selects an element by id?', a: ['querySelectorAll', 'getById', 'getElementById', 'find'], c: 2 },
        { q: 'What is 2 ** 10 in JavaScript?', a: ['100', '1024', '512', '20'], c: 1 },
        { q: 'Which event fires on a button click?', a: ['change', 'submit', 'hover', 'click'], c: 3 }
    ];
    var i = 0, score = 0;
    var prog = document.getElementById('quizProg'), qEl = document.getElementById('quizQ'), opts = document.getElementById('quizOpts');
    function show() {
        var item = QUESTIONS[i];
        prog.textContent = 'Question ' + (i + 1) + ' of ' + QUESTIONS.length;
        qEl.textContent = item.q;
        opts.innerHTML = item.a.map(function (a, k) {
            return '<button class="btn ghost q-opt" data-k="' + k + '" style="width:100%;text-align:left">' + a + '</button>';
        }).join('');
    }
    opts.addEventListener('click', function (e) {
        var k = e.target.getAttribute && e.target.getAttribute('data-k');
        if (k === null || k === undefined) return;
        if (+k === QUESTIONS[i].c) score++;
        i++;
        if (i < QUESTIONS.length) show();
        else {
            document.getElementById('quizBox').hidden = true;
            document.getElementById('quizDone').hidden = false;
            document.getElementById('quizScore').textContent = score + ' / ' + QUESTIONS.length;
        }
    });
    document.getElementById('quizRetry').addEventListener('click', function () {
        i = 0; score = 0;
        document.getElementById('quizBox').hidden = false;
        document.getElementById('quizDone').hidden = true;
        show();
    });
    show();
})();
</script>
<style>
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.quiz-score{font-size:20px;margin:10px 0}
.quiz-score b{color:var(--dark)}
</style>
</main>
<footer class="demo-foot">Buddy Edu · Practical Work demo — JavaScript Project 05</footer>
</body>
</html>
