<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05. Animation Gallery — Buddy Demo</title>
<style>
:root{--accent:#7c3aed;--dark:#5b21b6;--soft:#f5f3ff;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--border:#e4e9f2;--card:#fff}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 5%;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.demo-bar .back{font-weight:700;font-size:14px;color:#fff;text-decoration:none;padding:8px 15px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--dark))}
.demo-bar .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.demo{width:min(920px,92%);margin:34px auto 64px;flex:1}
.demo h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
.demo .lead{color:var(--muted);margin:8px 0 26px;max-width:640px}
.demo-foot{border-top:1px solid var(--border);padding:18px 5%;text-align:center;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 28px -22px rgba(15,23,42,.45);margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:10px;letter-spacing:-.01em}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--soft)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
pre,.terminal{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13.5px;line-height:1.7}
.grid{display:grid;gap:16px}
code{font-family:Consolas,monospace;background:var(--soft);color:var(--dark);padding:2px 6px;border-radius:6px;font-size:.92em}
.code-block{font-family:Consolas,"Courier New",monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;margin:14px 0;white-space:pre}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


</style>
</head>
<body>
<header class="demo-bar">
    <a class="back" href="../../CSS/index.html">← Back to CSS Course</a>
    <span class="tag">CSS · Project 05</span>
</header>
<main class="demo">
    <h1>05. Animation Gallery</h1>
    <p class="lead">Create animated buttons, loading effects, and transitions.</p>
    
<section class="panel">
    <h2>Buttons</h2>
    <div class="row" style="margin-top:8px">
        <button class="btn anim-pop">Pop</button>
        <button class="btn ghost anim-shift">Shift</button>
        <button class="btn anim-shine">Shine</button>
    </div>
    <h2 style="margin-top:22px">Loaders</h2>
    <div class="row" style="margin-top:10px;gap:26px">
        <div class="spin"></div>
        <div class="pulse"></div>
        <div class="bars"><i></i><i></i><i></i></div>
    </div>
    <h2 style="margin-top:22px">Skeleton card</h2>
    <div class="skel"><i class="sk-a"></i><i class="sk-b"></i><i class="sk-c"></i></div>
</section>
<style>
.anim-pop:hover{transform:scale(1.07)}
.anim-shift:hover{transform:translateY(-3px)}
.anim-shine{position:relative;overflow:hidden}
.anim-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%)}
.anim-shine:hover::after{transform:translateX(120%);transition:transform .6s}
.anim-pop,.anim-shift{transition:transform .2s}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{width:38px;height:38px;border-radius:50%;background:var(--accent);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.bars{display:flex;gap:5px;align-items:flex-end;height:38px}
.bars i{width:8px;border-radius:4px;background:var(--accent);animation:ba .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
@keyframes ba{0%,100%{height:12px}50%{height:36px}}
.skel{margin-top:10px;border:1px solid var(--border);border-radius:14px;padding:16px;background:#fff;max-width:320px}
.skel i{display:block;border-radius:8px;background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.4s infinite}
.sk-a{height:54px;width:54px;border-radius:50%!important;margin-bottom:10px}
.sk-b{height:14px;width:70%;margin-bottom:8px}
.sk-c{height:14px;width:90%}
@keyframes sk{to{background-position:-200% 0}}
</style>
</main>
<footer class="demo-foot">Buddy Edu · Practical Work demo — CSS Project 05</footer>
</body>
</html>
